[package]
name = "strands-shell-demo"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
strands-shell = { git = "https://github.com/strands-agents/shell", rev = "1d1a0aae9cf04e524687d3ed582b727a4b397ce2" }
tokio = { version = "1", features = ["rt"] }
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
