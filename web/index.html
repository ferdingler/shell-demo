<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="theme-color" content="#131615">
    <meta name="description" content="Strands Shell in your browser. A real shell, a local workspace. Just start typing.">
    <link rel="icon" type="image/svg+xml" href="/strands-logo.svg">
    <title>Strands Shell</title>
  </head>
  <body>
    <button id="accessibility" class="accessibility-control" type="button" aria-pressed="false">Enable screen reader mode</button>
    <header class="titlebar">
      <h1><img class="mark" src="/strands-logo.svg" width="28" height="28" alt=""> strands <span class="slash">/</span> <span class="product">shell</span></h1>
      <div class="titlebar-right">
        <span id="agent-status" class="session-state agent-state" hidden title="A local AI agent can run commands in this tab"><span class="state-dot" aria-hidden="true"></span><span role="status">agent</span></span>
        <span class="session-state"><span class="state-dot" aria-hidden="true"></span><span id="runtime-status" role="status">starting</span></span>
        <a href="https://strandsagents.com/docs/user-guide/shell" target="_blank" rel="noopener noreferrer" title="Open Shell documentation">docs <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main class="terminal-region" aria-label="Strands Shell terminal">
      <div id="terminal"></div>
    </main>
    <footer class="statusbar">
      <div class="shortcuts">
        <button id="help" type="button" title="Show commands and keyboard shortcuts"><span class="key">?</span> help</button>
        <span class="desktop-hint"><span class="key">↑↓</span> history</span>
        <button id="clear" type="button" title="Clear terminal (Ctrl+L)"><span class="key">^L</span> clear</button>
        <button id="stop" type="button" hidden title="Stop execution and reset workspace (Ctrl+C)"><span class="key">^C</span> stop</button>
      </div>
      <div class="session-info">
        <span id="last-result" aria-live="polite"></span>
        <button id="reset" type="button" title="Discard files and start a new session">new session <span aria-hidden="true">↻</span></button>
      </div>
    </footer>
    <dialog id="reset-dialog">
      <form method="dialog">
        <h2>Start a new session?</h2>
        <p>Your files and variables will be discarded.<br>The sample workspace will be restored.</p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>Keep working</button>
          <button value="reset" class="confirm">New session ↻</button>
        </div>
      </form>
    </dialog>
    <noscript>This terminal needs JavaScript to run the shell in your browser.</noscript>
    <script type="module" src="/main.js"></script>
  </body>
</html>
